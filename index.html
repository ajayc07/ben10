<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Omnitrix Alien Database</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%2300e64d%22/><circle cx=%2250%22 cy=%2250%22 r=%2226%22 fill=%22%23111%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Bangers&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-fx" aria-hidden="true">
  <span class="hexfloat h1"></span>
  <span class="hexfloat h2"></span>
  <span class="hexfloat h3"></span>
  <span class="hexfloat h4"></span>
  <span class="hexfloat h5"></span>
</div>

<div id="flashOverlay" aria-hidden="true"></div>

<header class="top-bar">
  <div class="brand">
    <div class="omnitrix-badge" id="omnitrixBadge">
      <div class="ring ring-outer"></div>
      <div class="ring ring-mid"></div>
      <div class="core"></div>
    </div>
    <div class="brand-text">
      <h1>OMNITRIX</h1>
      <p>Alien Database</p>
    </div>
  </div>

  <div class="controls">
    <div class="mode-toggle" id="modeToggle" role="tablist" aria-label="Choose mode">
      <button class="toggle-btn active" data-mode="explore" role="tab" aria-selected="true">
        <span class="ico">🛸</span> Explore
      </button>
      <button class="toggle-btn" data-mode="games" role="tab" aria-selected="false">
        <span class="ico">🎮</span> Games
      </button>
      <div class="toggle-pill" id="togglePill"></div>
    </div>

    <button class="fullscreen-btn" id="fullscreenBtn" aria-label="Toggle full screen">⛶</button>
  </div>
</header>

<section id="explorePanel">
  <p class="alien-count" id="alienCount">70 Aliens Unlocked!</p>
  <main id="cardContainer" class="card-container view-grid"></main>
</section>

<section id="gamesPanel" class="hidden">
  <div class="game-hub" id="gameHub">
    <button class="game-card" data-game="count">
      <span class="game-card-icon">🔢</span>
      <span class="game-card-title">Count the Aliens</span>
      <span class="game-card-desc">Count up to 10!</span>
    </button>
    <button class="game-card" data-game="letter">
      <span class="game-card-icon">🔤</span>
      <span class="game-card-title">Letter Match</span>
      <span class="game-card-desc">Find the matching letter!</span>
    </button>
    <button class="game-card" data-game="sound">
      <span class="game-card-icon">👂</span>
      <span class="game-card-title">Letter Sounds</span>
      <span class="game-card-desc">Listen and find the letter!</span>
    </button>
    <button class="game-card" data-game="number">
      <span class="game-card-icon">🔟</span>
      <span class="game-card-title">Number Recognize</span>
      <span class="game-card-desc">Numbers 10 to 20!</span>
    </button>
    <button class="game-card" data-game="memory">
      <span class="game-card-icon">🧠</span>
      <span class="game-card-title">Memory Match</span>
      <span class="game-card-desc">Find the matching pairs!</span>
    </button>
    <button class="game-card" data-game="odd">
      <span class="game-card-icon">🔍</span>
      <span class="game-card-title">Spot the Odd One</span>
      <span class="game-card-desc">Which one is different?</span>
    </button>
    <button class="game-card" data-game="compare">
      <span class="game-card-icon">⚖️</span>
      <span class="game-card-title">More or Less</span>
      <span class="game-card-desc">Which side has more?</span>
    </button>
    <button class="game-card" data-game="arrow">
      <span class="game-card-icon">🕹️</span>
      <span class="game-card-title">Arrow Quest</span>
      <span class="game-card-desc">Up, down, left, right!</span>
    </button>
    <button class="game-card" data-game="dial">
      <span class="game-card-icon">⌚</span>
      <span class="game-card-title">Omnitrix Dial</span>
      <span class="game-card-desc">Turn the dial, press OK!</span>
    </button>
    <button class="game-card" data-game="find">
      <span class="game-card-icon">🎯</span>
      <span class="game-card-title">Find It!</span>
      <span class="game-card-desc">Move the box, press OK!</span>
    </button>
  </div>

  <div class="game-screen hidden" id="gameScreen">
    <div class="game-screen-header">
      <button class="game-back" id="gameBack">‹ Back</button>
      <div class="game-score" id="gameScore">⭐ 0</div>
    </div>
    <div class="game-content" id="gameContent"></div>
    <div class="game-feedback" id="gameFeedback"></div>
  </div>
</section>

<div id="modalOverlay" class="modal-overlay hidden">
  <button class="modal-nav prev" id="modalPrev" aria-label="Previous alien">‹</button>

  <div class="modal-card" id="modalCard">
    <button class="modal-close" id="modalClose" aria-label="Close">✕</button>

    <div class="modal-portrait-wrap">
      <div class="modal-ring spin-slow"></div>
      <div class="modal-ring spin-fast reverse"></div>
      <img id="modalImg" class="modal-portrait" src="" alt="">
      <div class="particles" id="particles"></div>
    </div>

    <div class="hero-time" id="heroTime">IT'S HERO TIME!</div>

    <h2 id="modalName" class="modal-name"></h2>
    <p id="modalSpecies" class="modal-species"></p>

    <div class="stat-list" id="statList"></div>
  </div>

  <button class="modal-nav next" id="modalNext" aria-label="Next alien">›</button>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
<script src="games.js"></script>
</body>
</html>
